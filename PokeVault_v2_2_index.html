(()=>{'use strict';const KEY='pokevault-v1',SETTINGS='pokevault-v2-settings',SALES='pokevault-v2-sales',TRADES='pokevault-v2-trades',PULLS='pokevault-v21-pulls';const $=id=>document.getElementById(id);const sections=[['review','🔎','Inspection'],['collection','🗃️','Collection'],['grading','🏅','Grading'],['selling','🏷️','Selling'],['sealed','📦','Sealed Products'],['trading','🔄','Trading'],['sold','🧾','Sold'],['pulls','🎴','Pull Tracker']];const subs={review:['All Cards','Not Inspected','PSA 10 Candidates','PSA 9 Candidates','Needs Review','Completed'],collection:['All Cards','All Vaults','Raw Cards','PSA Slabs'],grading:['All Cards','PSA Candidates','Ready to Submit','Submitted to PSA','At PSA','Graded / Returned'],selling:['All Listings','Preparing','Ready to List','Listed','Pending Sale','Sold'],sealed:['All Sealed','ETBs','Booster Boxes','Booster Cases','Booster Bundles','Packs','Tins','Collection Boxes','Other'],trading:['Available to Trade','Create Trade','Trade Offers','Pending Trades','Completed Trades','Trade History'],sold:['All Sold','Raw Cards','PSA Slabs','Sealed Products','Sales History','Profit / Loss'],pulls:['Overview','Pack Purchases','Opening Sessions','Pulled Cards','Sold Pulls','Profit / Loss']};const sealedTypes=[['etb','ETB'],['boosterbox','Booster box'],['boostercase','Booster case'],['bundle','Booster bundle'],['pack','Sealed pack'],['tin','Tin'],['collectionbox','Collection box'],['othersealed','Other sealed product']];const langs=['English','Japanese','Korean','Simplified Chinese','Traditional Chinese','Other'];let cards=[],sales=[],trades=[],pulls={purchases:[],sessions:[]},settings={},section='',sub='',editing=null,view='grid',selected=new Set(),incoming=[],tradeCash=0,tradeCashReceived=0;const num=x=>Number(x)||0,usd=x=>'$'+num(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),isSealed=c=>c.portfolio==='sealed'||(c.itemType&&c.itemType!=='card'),quantity=c=>isSealed(c)?Math.max(0,num(c.quantity)):1,marketValue=c=>num(c.market)*quantity(c),costValue=c=>(c.currency==='USD'?num(c.purchase):(num(c.fx)?num(c.purchase)/num(c.fx):0))*quantity(c),vaults=()=>[...new Set(cards.map(c=>c.vault).filter(Boolean))].sort();function persist(){try{localStorage.setItem(KEY,JSON.stringify(cards));localStorage.setItem(SALES,JSON.stringify(sales));localStorage.setItem(TRADES,JSON.stringify(trades));localStorage.setItem(PULLS,JSON.stringify(pulls));localStorage.setItem(SETTINGS,JSON.stringify(settings));return true}catch(e){alert('Storage full. Inventory change was not saved.');return false}}function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');cards=Array.isArray(x)?x:[]}catch(e){cards=[]}try{sales=JSON.parse(localStorage.getItem(SALES)||'[]')||[]}catch(e){sales=[]}try{trades=JSON.parse(localStorage.getItem(TRADES)||'[]')||[]}catch(e){trades=[]}try{pulls=JSON.parse(localStorage.getItem(PULLS)||'null')||{purchases:[],sessions:[]}}catch(e){pulls={purchases:[],sessions:[]}}try{settings=JSON.parse(localStorage.getItem(SETTINGS)||'{}')||{}}catch(e){settings={}}cards.forEach(c=>{if(!c.id)c.id=uid();if(!c.language)c.language='';if(!c.itemType)c.itemType='card';if(!c.acquisitionCode)c.acquisitionCode=(c.displayId||'').split('-')[0]||((c.itemType!=='card')?'SP':'OT')});for(const c of cards)if(!c.displayId)assignDisplayId(c)}
let photoDBPromise;function openPhotoDB(){if(!('indexedDB' in window))return Promise.reject(Error('IndexedDB unavailable'));return photoDBPromise||(photoDBPromise=new Promise((ok,no)=>{let r=indexedDB.open('pokevault-photos-v22',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}).catch(err=>{photoDBPromise=null;throw err}))}async function savePhotoBlob(id,side,blob){let db=await openPhotoDB();await new Promise((ok,no)=>{let tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(blob,id+':'+side);tx.oncomplete=()=>ok();tx.onerror=()=>no(tx.error)})}async function storePhoto(id,side,file){let bitmap=await createImageBitmap(file),scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();let blob=await new Promise((ok,no)=>canvas.toBlob(b=>b?ok(b):no(Error('Compression failed')),'image/jpeg',.8));await savePhotoBlob(id,side,blob)}async function readPhoto(id,side){let db=await openPhotoDB();return new Promise((ok,no)=>{let r=db.transaction('photos').objectStore('photos').get(id+':'+side);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function showThumbnails(){for(let img of document.querySelectorAll('[data-photo]')){try{let blob=await readPhoto(img.dataset.photo,'front');if(blob){let url=URL.createObjectURL(blob);img.src=url;img.onload=()=>URL.revokeObjectURL(url)}}catch(err){}}}function dataUrl(blob){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(blob)})}async function saveBackupPhotos(items){for(let c of items){for(let side of ['front','back']){try{let blob=await readPhoto(c.id,side);if(blob)c[side==='front'?'photoFront':'backPhoto']=await dataUrl(blob)}catch(e n summary (current section only)</b><p class="muted">'+methods.map(([k,n])=>totals[k]?esc(n)+': '+totals[k]:'').filter(Boolean).join(' · ')+'</p></div>'}function pullSpend(){return pulls.purchases.reduce((n,p)=>n+num(p.qty)*num(p.unitCost)*(p.currency==='USD'?1:(num(p.fx)?1/num(p.fx):0)),0)}function renderPulls(){let a=$('app');const linked=cards.filter(c=>acqCode(c)==='PL');const sold=sales.filter(x=>String(x.snapshot?.displayId||'').startsWith('PL-')||linked.some(c=>c.id===x.itemId));const revenue=sold.reduce((n,x)=>n+num(x.price),0),net=sold.reduce((n,x)=>n+num(x.price)-num(x.fees)-num(x.shipping)-num(x.other),0),spent=pullSpend();a.innerHTML='<h2>🎴 Pull Tracker</h2><div class="tabs">'+subs.pulls.map(x=>'<button class="btn '+(sub===x?'active':'')+'" data-sub="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div><div class="panel"><b>Independent pull accounting</b><p class="muted">Pack purchases and sessions are tracked here only. Transferred cards stay in their destination tab; this screen shows linked references, not duplicate inventory.</p></div>';if(sub==='Overview'||sub==='Profit / Loss'){a.innerHTML+='<div class="stats"><div class="stat"><b>'+usd(spent)+'</b><small>Pack spending (USD)</small></div><div class="stat"><b>'+usd(revenue)+'</b><small>Gross sold pulls</small></div><div class="stat"><b>'+usd(net-spent)+'</b><small>Net cash return</small></div><div class="stat"><b>'+(spent?((revenue/spent)*100).toFixed(1)+'%':'N/A')+'</b><small>Gross spending recovered</small></div><div class="stat"><b>'+(spent?(((net-spent)/spent)*100).toFixed(1)+'%':'N/A')+'</b><small>Net return after spending</small></div></div><p class="muted">Net return deducts recorded sale fees, shipping and other sale costs. Unrecorded grading costs are not included. Non-USD purchases require an entered exchange rate.</p>'}if(sub==='Pack Purchases'||sub==='Overview'){a.innerHTML+='<div class="panel"><b>Pack Purchases</b><div class="actions">'+btn('＋ Record Pack Purchase','addPack','primary')+'</div>'+pulls.purchases.map(p=>'<div class="item"><b>'+esc(p.id)+' · '+esc(p.product)+'</b><p>'+esc(p.date)+' · '+esc(p.source)+' · '+esc(p.qty)+' × '+esc(p.unitCost)+' '+esc(p.currency)+' · '+esc(p.opened||0)+' opened</p></div>').join('')+'</div>'}if(sub==='Opening Sessions'){a.innerHTML+='<div class="panel"><b>Opening Sessions</b><div class="actions">'+btn('＋ Record Opening Session','addSession','primary')+'</div>'+pulls.sessions.map(p=>'<div class="item"><b>'+esc(p.id)+'</b><p>'+esc(p.date)+' · Purchase '+esc(p.purchaseId)+' · '+esc(p.count)+' packs opened</p></div>').join('')+'</div>'}if(sub==='Pulled Cards'){a.innerHTML+='<div class="panel"><b>Pulled card references</b><p class="muted">These are links to original cards, not separate inventory copies.</p>'+linked.map(c=>'<div class="item"><b>'+esc(c.displayId||'PL record')+' · '+esc(c.name)+'</b><p>'+esc(c.language)+' · Currently in '+esc(sectionName(c.portfolio))+' · Session '+esc(c.pullSessionId||'Not linked')+'</p></div>').join('')+'</div>'}if(sub==='Sold Pulls'){a.innerHTML+='<div class="panel"><b>Sold pulled cards</b><p>Gross '+usd(revenue)+' · Net sale proceeds '+usd(net)+'</p>'+sold.map(x=>'<div class="item"><b>'+esc(x.snapshot?.displayId||'PL linked')+' · '+esc(x.name)+'</b><p>Sale '+usd(x.price)+' · Net '+usd(num(x.price)-num(x.fees)-num(x.shipping)-num(x.other))+'</p></div>').join('')+'</div>'}}function addPack(){let product=prompt('Product / set (loose packs, booster box, etc.)','Loose packs');if(!product)return;let qty=Number(prompt('Quantity purchased','1'));let unitCost=Number(prompt('Cost per unit in purchase currency','0'));if(!Number.isInteger(qty)||qty<1||!Number.isFinite(unitCost)||unitCost<0)return alert('Invalid quantity or cost');let currency=prompt('Currency: USD, JPY, KRW, CNY, TWD, PHP','USD')||'USD';let fx=currency==='USD'?1:Number(prompt('Exchange rate: units of '+currency+' per 1 USD (required for USD reports)','0'));let source=prompt('Where purchased?','')||'';let date=prompt('Purchase date YYYY-MM-DD',new Date().toISOString().slice(0,10))||'';let id='PK-'+date.slice(2,4)+date.slice(5,7)+'-'+String(pulls.purchases.length+1).padStart(4,'0');pulls.purchases.push({id,product,qty,unitCost,currency,fx,source,date,opened:0});persist();render()}function addSession(){if(!pulls.purchases.length)return alert('Record a pack purchase first');let purchaseId=prompt('Pack purchase ID:\n'+pulls.purchases.map(p=>p.id+' '+p.product).join('\n'),pulls.purchases.at(-1).id);let p=pulls.purchases.find(x=>x.id===purchaseId);if(!p)return alert('Purchase not found');let count=Number(prompt('Number of packs opened in this session','1'));if(!Number.isInteger(count)||count<1||count>p.qty-num(p.opened))return alert('Invalid count or not enough unopened packs');let date=prompt('Date opened YYYY-MM-DD',new Date().toISOString().slice(0,10))||'';p.opened=num(p.opened)+count;pulls.sessions.push({id:'PS-'+date.slice(2,4)+date.slice(5,7)+'-'+String(pulls.sessions.length+1).padStart(4,'0'),purchaseId,count,date});persist();render()}const opt=(items,val)=>items.map(x=>'<option value="'+esc(Array.isArray(x)?x[0]:x)+'" '+(String(val)===String(Array.isArray(x)?x[0]:x)?'selected':'')+'>'+esc(Array.isArray(x)?x[1]:x)+'</option>').join('');const field=(id,label,value='',type='text',extra='')=>'<div '+extra+'><label for="f_'+id+'">'+label+'</label><input class="field" id="f_'+id+'" type="'+type+'" value="'+esc(value)+'"></div>';const select=(id,label,items,value='',extra='')=>'<div '+extra+'><label for="f_'+id+'">'+label+'</label><select class="field" id="f_'+id+'">'+opt(items,value)+'</select></div>';function showHome(){section='';sub='';render()}function go(s){section=s;sub=subs[s][0];render()}function btn(t,act,cls='') {return '<button class="btn '+cls+'" data-act="'+act+'">'+t+'</button>'}function render(){const a=$('app');if(!section){const active=cards.filter(c=>c.portfolio!=='sold'),val=active.reduce((s,c)=>s+marketValue(c),0),cost=active.reduce((s,c)=>s+costValue(c),0),profit=sales.r $('restoreInput').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());let items=Array.isArray(data)?data:data.cards;if(!Array.isArray(items))throw Error('Missing cards array');if(!confirm('Replace current inventory with '+items.length+' backed-up items? Download a backup first.'))return;await restoreBackupPhotos(items);cards=items;sales=Array.isArray(data.sales)?data.sales:[];trades=Array.isArray(data.trades)?data.trades:[];pulls=data.pulls&&Array.isArray(data.pulls.purchases)&&Array.isArray(data.pulls.sessions)?data.pulls:{purchases:[],sessions:[]};settings=data.settings||{};persist();showHome();alert('Backup restored')}catch(err){alert('Invalid backup: '+err.message)}finally{e.target.value=''}};
document.addEventListener('click',e=>{let t=e.target.closest('[data-go],[data-sub],[data-edit],[data-move],[data-act],[data-sale],[data-removeincoming],[data-tradestatus]');if(!t)return;if(t.dataset.go){go(t.dataset.go);return}if(t.dataset.sub){sub=t.dataset.sub;render();return}if(t.dataset.edit){openEditor(t.dataset.edit);return}if(t.dataset.move){const c=cards.find(x=>x.id===t.dataset.move);if(!c)return;const opts=sections.filter(x=>x[0]!=='pulls'&&x[0]!=='sold'&&x[0]!==c.portfolio);const dest=prompt('Transfer '+c.name+' ('+(c.displayId||'')+') to:\n'+opts.map((x,i)=>(i+1)+' '+x[2]).join('\n'),'1');if(dest!==null&&opts[Number(dest)-1])moveCard(c.id,opts[Number(dest)-1][0]);return}if(t.dataset.sale){let x=sales.find(s=>s.id===t.dataset.sale);if(!x)return;let price=prompt('Correct sale price (USD)',x.price);if(price===null)return;let fees=prompt('Correct fees (USD)',x.fees);if(fees===null)return;x.price=num(price);x.fees=num(fees);persist();render();return}if(t.dataset.removeincoming!==undefined){incoming.splice(Number(t.dataset.removeincoming),1);render();return}if(t.dataset.tradestatus){let x=trades.find(t=>t.id===t.dataset.tradestatus);if(!x)return;let status=prompt('Trade status: Offer, Pending, Completed, Cancelled',x.status);if(status!==null){x.status=status;persist();render()}return}switch(t.dataset.act){case 'quick':quick();break;case 'addPack':addPack();break;case 'addSession':addSession();break;case 'price':priceInfo();break;case 'add':openEditor();break;case 'toggle':view=view==='grid'?'list':'grid';render();break;case 'vaults':manageVaults();break;case 'sold':go('sold');break;case 'backup':backup();break;case 'restore':$('restoreInput').click();break;case 'csv':exportCsv();break;case 'selectall':cards.filter(c=>c.portfolio==='trading'&&!isSealed(c)).forEach(c=>selected.add(c.id));render();break;case 'clear':selected.clear();render();break;case 'incoming':incoming.push({name:'',value:0});render();break;case 'saveTrade':{let giving=cards.filter(c=>selected.has(c.id));if(!giving.length){alert('Select at least one outgoing card');return}let receive=incoming.filter(x=>x.name.trim());let g=giving.reduce((s,c)=>s+num(c.market),0),r=receive.reduce((s,c)=>s+num(c.value),0),diff=r+tradeCashReceived-g-tradeCash;trades.push({id:uid(),date:new Date().toISOString().slice(0,10),status:'Offer',giving:giving.map(c=>({id:c.id,name:c.name,value:num(c.market)})),incoming:receive,cashPaid:tradeCash,cashReceived:tradeCashReceived,difference:diff,percent:g+tradeCash>0?100*diff/(g+tradeCash):0});persist();alert('Trade record saved. Inventory is unchanged until a trade-completion workflow is implemented.');sub='Trade History';render();break}}});document.addEventListener('change',e=>{if(e.target.dataset.inname!==undefined){incoming[Number(e.target.dataset.inname)].name=e.target.value}if(e.target.dataset.inprice!==undefined){incoming[Number(e.target.dataset.inprice)].value=num(e.target.value);render()}});$('homeBtn').onclick=showHome;$('backupBtn').onclick=backup;$('settingsBtn').onclick=settingsPage;load();render()})();
</script></body></html>
